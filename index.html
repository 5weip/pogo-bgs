<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pokémon GO 背卡圖鑑</title>
<style>
:root{--bg:#0b1120;--panel:#1e293b;--card:#0f172a;--text:#f8fafc;--sub:#94a3b8;--acc:#38bdf8;--ok:#10b981;--sh:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
body{background:var(--bg);color:var(--text);padding:16px;max-width:1180px;margin:0 auto;}
header{text-align:center;padding:18px;background:var(--panel);border-radius:16px;border:1px solid #334155;margin-bottom:18px;}
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.back-home-btn{padding:6px 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#f8fafc;cursor:pointer;font-size:0.8rem;font-weight:700;transition:0.15s;}
.back-home-btn:hover{border-color:var(--acc);color:var(--acc);}
.col-badge{background:rgba(56,189,248,0.15);color:var(--acc);border:1px solid rgba(56,189,248,0.4);padding:3px 9px;border-radius:99px;font-size:0.74rem;font-weight:700;}
h1{font-size:1.38rem;margin-bottom:6px;color:#fff;}
.sub-header{font-size:0.82rem;color:var(--sub);margin-bottom:12px;}
.prog-wrap{background:var(--card);padding:10px 14px;border-radius:10px;border:1px solid #334155;}
.prog-text{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:0.82rem;font-weight:600;margin-bottom:6px;}
.bar-bg{height:8px;background:#334155;border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--sh),var(--ok));width:0%;transition:0.3s;}
.albums-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;}
.album-card{background:var(--panel);border-radius:18px;overflow:hidden;border:2px solid #334155;cursor:pointer;transition:all 0.22s ease;display:flex;flex-direction:column;}
.album-card:hover{border-color:var(--acc);transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,0.5);}
.album-visual{height:165px;position:relative;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;}
.album-visual::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0.2),rgba(15,23,42,0.85));}
.album-tag{position:absolute;top:10px;right:10px;z-index:2;background:rgba(15,23,42,0.85);color:#fde68a;border:1px solid var(--sh);padding:3px 9px;border-radius:99px;font-size:0.72rem;font-weight:700;}
.album-pokes{position:relative;z-index:2;display:flex;gap:6px;align-items:center;}
.album-poke{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.85));transition:0.25s;}
.album-card:hover .album-poke{transform:scale(1.08);}
.album-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1;}
.album-title{font-size:1.1rem;font-weight:800;color:#fff;}
.album-sub{font-size:0.78rem;color:var(--sub);margin-bottom:4px;}
.album-enter{margin-top:auto;padding-top:6px;text-align:right;font-size:0.8rem;font-weight:800;color:var(--acc);}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center;}
.search{flex:1 1 160px;padding:9px 12px;border-radius:8px;border:1px solid #334155;background:var(--panel);color:#fff;}
.btn{padding:8px 12px;border-radius:8px;border:1px solid #334155;background:var(--panel);color:var(--sub);cursor:pointer;font-size:0.8rem;font-weight:600;transition:0.15s;}
.btn:hover{border-color:#64748b;color:#fff;}
.btn.active{background:var(--acc);color:#0f172a;border-color:var(--acc);}
.btn-global-mode{border-color:#a855f7;color:#e9d5ff;background:rgba(168,85,247,0.18);margin-left:auto;}
.sets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
.single-poke-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;}
.set-box{background:var(--panel);border-radius:16px;padding:12px;border:1px solid #334155;display:flex;flex-direction:column;gap:10px;}
.set-header{display:flex;justify-content:space-between;align-items:center;gap:6px;padding-bottom:8px;border-bottom:1px solid #334155;}
.set-title-wrap{overflow:hidden;}
.set-eng{font-size:1rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;}
.set-id{background:#0f172a;color:var(--acc);padding:2px 6px;border-radius:5px;font-size:0.74rem;border:1px solid #334155;}
.set-zh{font-size:0.75rem;color:var(--sub);margin-top:2px;}
.mode-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--sh);background:rgba(245,158,11,0.18);color:#fde68a;font-size:0.74rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.mode-btn.normal-mode{border-color:#64748b;background:#0f172a;color:#cbd5e1;}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pogo-card{position:relative;height:260px;border-radius:14px;overflow:hidden;border:2px solid #475569;background:#0f172a;user-select:none;transition:all 0.2s ease;display:flex;flex-direction:column;justify-content:space-between;}
.pogo-card.locked{opacity:0.84;border-style:dashed;}
.pogo-card.owned{opacity:1;border-style:solid;border-width:3px;border-color:var(--ok);box-shadow:0 0 16px rgba(16,185,129,0.5);transform:translateY(-2px);}
.pogo-card.owned.is-shiny{border-color:var(--sh);box-shadow:0 0 18px rgba(245,158,11,0.6);}
.card-preview-trigger{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border-radius:12px;}
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;z-index:1;pointer-events:none;}
.card-top{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:7px 8px;font-size:0.7rem;font-weight:700;pointer-events:none;}
.ver-tag{padding:2px 6px;border-radius:5px;background:rgba(245,158,11,0.92);color:#0f172a;}
.ver-tag.norm{background:rgba(15,23,42,0.85);color:#e2e8f0;border:1px solid rgba(255,255,255,0.25);}
.ver-tag-btn{pointer-events:auto;padding:3px 7px;border-radius:5px;border:none;background:rgba(245,158,11,0.92);color:#0f172a;font-size:0.7rem;font-weight:800;cursor:pointer;}
.ver-tag-btn.norm{background:rgba(15,23,42,0.88);color:#e2e8f0;border:1px solid rgba(255,255,255,0.3);}
.own-badge{pointer-events:auto;padding:3px 8px;border-radius:99px;background:rgba(15,23,42,0.82);border:1.5px solid rgba(255,255,255,0.45);font-size:0.7rem;font-weight:700;color:#e2e8f0;cursor:pointer;}
.pogo-card.owned .own-badge{background:var(--ok);border-color:#fff;color:#0f172a;font-weight:800;}
.pogo-card.owned .own-badge.from-shiny{background:var(--sh);color:#0f172a;}
.poke-layer{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;height:130px;transition:0.25s;pointer-events:none;}
.pogo-card:hover .poke-layer{transform:scale(1.08);}
.poke-img{width:124px;height:124px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.85));}
.sparkles{position:absolute;inset:0;pointer-events:none;z-index:4;font-size:1rem;color:#fde047;text-shadow:0 0 8px #f59e0b;}
.sp1{position:absolute;top:36px;left:18px;}.sp2{position:absolute;top:44px;right:16px;}.sp3{position:absolute;bottom:72px;left:24px;font-size:0.85rem;}
.loc-stamp{position:relative;z-index:3;background:linear-gradient(180deg,transparent,rgba(15,23,42,0.95) 32%);padding:14px 6px 7px;text-align:center;pointer-events:none;}
.poke-name{font-size:0.85rem;font-weight:800;color:#fff;margin-bottom:3px;display:flex;align-items:center;justify-content:center;gap:5px;}
.evo-dots{display:inline-flex;gap:3px;background:rgba(0,0,0,0.45);padding:2px 5px;border-radius:99px;border:1px solid rgba(255,255,255,0.2);}
.evo-dot{width:6px;height:6px;border-radius:50%;background:#475569;}.evo-dot.on{background:var(--ok);}.evo-dot.on-sh{background:var(--sh);}
.stamp-pill{display:inline-block;background:rgba(15,23,42,0.78);border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:2px 7px;font-size:0.64rem;color:#cbd5e1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.evo-hint{font-size:0.63rem;color:#38bdf8;margin-top:3px;font-weight:600;}
.modal-mask{position:fixed;inset:0;background:rgba(2,6,23,0.84);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-mask.show{display:flex;}
.modal-box{background:var(--panel);border:1px solid #475569;border-radius:20px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:18px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #334155;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.modal-title{font-size:1.1rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.close-btn{padding:6px 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#f8fafc;cursor:pointer;font-weight:700;font-size:0.8rem;}
.evo-subbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:0.82rem;color:var(--sub);gap:8px;flex-wrap:wrap;}
.check-all-btn{padding:5px 10px;border-radius:8px;border:1px solid var(--ok);background:rgba(16,185,129,0.15);color:#34d399;cursor:pointer;font-size:0.75rem;font-weight:700;}
.evo-row{display:grid;grid-template-columns:repeat(auto-fill,190px);justify-content:center;gap:14px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,0.95);color:#fde68a;border:1px solid var(--sh);padding:10px 18px;border-radius:99px;font-size:0.82rem;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:all 0.25s ease;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
footer{margin-top:28px;text-align:center;font-size:0.72rem;color:#64748b;line-height:1.5;}
</style>
</head>
<body>
<div id="appRoot"></div>
<div class="modal-mask" id="evoModal" role="dialog" aria-modal="true">
<div class="modal-box" id="evoModalContent"></div>
</div>
<div class="toast" id="toastMsg" role="status" aria-live="polite"></div>
<footer>本工具為玩家自製非營利收藏紀錄工具，寶可夢模型串接自 PokeMiners，背卡串接自 Dittobase。</footer>
<script src="./data.js"></script>
<script>
(function mainAppScript() {
  var LT = String.fromCharCode(60);
  var GT = String.fromCharCode(62);
  var AMP = String.fromCharCode(38);
  var LT_REG = new RegExp(LT, "g");
  var GT_REG = new RegExp(GT, "g");

  function T(s) { return s.replace(/«/g, LT).replace(/»/g, GT); }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, AMP + "amp;")
      .replace(/"/g, AMP + "quot;")
      .replace(/'/g, AMP + "#39;")
      .replace(LT_REG, AMP + "lt;")
      .replace(GT_REG, AMP + "gt;")
      .replace(/«/g, AMP + "lt;")
      .replace(/»/g, AMP + "gt;");
  }

  var ttPolicy = null;
  if (window.trustedTypes && window.trustedTypes.createPolicy) {
    try {
      ttPolicy = window.trustedTypes.defaultPolicy || window.trustedTypes.createPolicy("default", {
        createHTML: function(s) { return s; }
      });
    } catch (e) {
      try {
        ttPolicy = window.trustedTypes.createPolicy("pogoLocalTemplatePolicy", {
          createHTML: function(s) { return s; }
        });
      } catch (e2) {}
    }
  }
  function renderTemplate(el, templateStr) {
    var html = T(templateStr);
    el.innerHTML = ttPolicy ? ttPolicy.createHTML(html) : html;
  }

  var DATA = window.POGO_DATA;
  if (!DATA) {
    document.body.textContent = "載入失敗：找不到 data.js，請確認 data.js 與 index.html 放在同一個 GitHub 資料夾內。";
    return;
  }

  var FAMILIES = DATA.FAMILIES;
  var COLLECTIONS = DATA.COLLECTIONS;
  var PM_ADDR_BASE = "https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Pokemon%20-%20256x256/Addressable%20Assets/";
  var PM_ICON_BASE = "https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Pokemon%20-%20256x256/";

  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById("toastMsg");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.classList.remove("show"); }, 2800);
  }

  function warnLockedByShiny() {
    showToast("✨ 此背卡已經由「色背」自動解鎖！若要取消，請切換至色背模式操作。");
  }

  // ---- 背景圖自動嘗試多種副檔名機制 ----
  // resolvedBgByCol：卡冊等級的背景圖（single-bg 卡冊 + 首頁封面）
  // resolvedBgByLoc：地標等級的背景圖（multi-location / multi-location-single 卡冊裡每個地標各自的圖）
  var resolvedBgByCol = {};
  var resolvedBgByLoc = {};

  // 依序試候選網址清單，哪個先載入成功就用哪個；全部失敗就退回第一個候選（至少畫面一致）
  function probeCandidates(candidates, onResolved) {
    (function probe(idx) {
      if (idx >= candidates.length) { onResolved(candidates[0]); return; }
      var img = new Image();
      img.onload = function() { onResolved(candidates[idx]); };
      img.onerror = function() { probe(idx + 1); };
      img.src = candidates[idx];
    })(0);
  }

  function updateBgEls(attrName, attrValue, url) {
    var els = document.querySelectorAll("[" + attrName + "='" + attrValue + "']");
    Array.prototype.forEach.call(els, function(el) {
      el.style.backgroundImage = "url('" + url + "')";
    });
  }

  var statesByCol = {};
  var storageAvailable = true;

  // multi-location 系列型別（包含 multi-location 與 multi-location-single）共用的探測邏輯
  var MULTI_LOCATION_TYPES = ["multi-location", "multi-location-single"];

  COLLECTIONS.forEach(function(col) {
    statesByCol[col.id] = {};
    try {
      var raw = localStorage.getItem(col.storageKey);
      if (raw) statesByCol[col.id] = JSON.parse(raw);
    } catch (e) {
      storageAvailable = false;
    }

    if (col.type === "single-bg") {
      var colCandidates = DATA.bgCandidates(col.bgType, col.bgKey);
      resolvedBgByCol[col.id] = colCandidates[0];
      probeCandidates(colCandidates, function(url) {
        resolvedBgByCol[col.id] = url;
        updateBgEls("data-col-bg", col.id, url);
      });
    } else if (MULTI_LOCATION_TYPES.indexOf(col.type) !== -1) {
      col.locations.forEach(function(loc) {
        var locKey = col.id + "|" + loc.id;
        var locCandidates = DATA.bgCandidates(loc.bgType || col.bgType, loc.bgKey);
        resolvedBgByLoc[locKey] = locCandidates[0];
        probeCandidates(locCandidates, function(url) {
          resolvedBgByLoc[locKey] = url;
          updateBgEls("data-loc-bg", locKey, url);
        });
      });
      var coverCandidates = DATA.bgCandidates(col.bgType, col.coverBgKey);
      resolvedBgByCol[col.id] = coverCandidates[0];
      probeCandidates(coverCandidates, function(url) {
        resolvedBgByCol[col.id] = url;
        updateBgEls("data-col-bg", col.id, url);
      });
    }
  });

  var currentColId = null;
  var filter = "ALL", query = "", allNormalToggle = false;
  var activeModalItemId = null, activeModalFamily = null;

  function getCol(colId) {
    return COLLECTIONS.find(function(c) { return c.id === colId; });
  }

  function getItemState(colId, itemId) {
    var colState = statesByCol[colId];
    if (!colState[itemId]) colState[itemId] = { isNormal: false };
    return colState[itemId];
  }

  function saveColState(colId) {
    if (!storageAvailable) return;
    var col = getCol(colId);
    if (!col) return;
    try {
      localStorage.setItem(col.storageKey, JSON.stringify(statesByCol[colId]));
    } catch (e) {
      showToast("⚠️ 儲存空間不足或遭封鎖，變更無法保存。");
    }
  }

  function isStageShinyOwned(st, baseKey) { return !!st[baseKey]; }
  function isStageCardOwned(st, baseKey) { return !!(st[baseKey] || st["n_" + baseKey]); }
  function isStageOwnedInView(st, baseKey, isNormalView) {
    return isNormalView ? isStageCardOwned(st, baseKey) : isStageShinyOwned(st, baseKey);
  }

  function isFamilyOwnedInView(st, famKey, isNormalView) {
    return FAMILIES[famKey].stages.some(function(p) {
      return isStageOwnedInView(st, p.key, isNormalView);
    });
  }

  function isFamilyAllOwnedInView(st, famKey, isNormalView) {
    return FAMILIES[famKey].stages.every(function(p) {
      return isStageOwnedInView(st, p.key, isNormalView);
    });
  }

  function padDexNumber(dex) {
    return String(dex).padStart(3, "0");
  }

  function pogoImgHtml(dex, isShiny, altName, extraCls) {
    var addrUrl = PM_ADDR_BASE + "pm" + dex + (isShiny ? ".s" : "") + ".icon.png";
    var legacyUrl = PM_ICON_BASE + "pokemon_icon_" + padDexNumber(dex) + "_00" + (isShiny ? "_shiny" : "") + ".png";
    var cls = "poke-img" + (extraCls ? (" " + extraCls) : "");
    return "«img class='" + cls + "' src='" + escapeHtml(addrUrl) + "' data-fallback='" + escapeHtml(legacyUrl) + "' alt='" + escapeHtml(altName) + "'»";
  }

  function bindImgFallbacks(container) {
    var imgs = container.querySelectorAll("img[data-fallback]");
    Array.prototype.forEach.call(imgs, function(img) {
      img.addEventListener("error", function() {
        var fb = img.getAttribute("data-fallback");
        if (fb && img.src !== fb) img.src = fb;
      }, { once: true });
    });
  }

  function computeCollectionStats(col) {
    var shinyTotal = 0, cardTotal = 0, maxCards = 0;
    var subA = 0, subB = 0;
    if (col.type === "multi-location") {
      maxCards = col.locations.length * 2;
      col.locations.forEach(function(loc) {
        var st = getItemState(col.id, loc.id);
        var raidFam = col.zoneToFamily[loc.zone];
        var tSh = isFamilyOwnedInView(st, "treecko", false);
        var rSh = isFamilyOwnedInView(st, raidFam, false);
        if (tSh) { shinyTotal++; subA++; }
        if (rSh) { shinyTotal++; subB++; }
        if (isFamilyOwnedInView(st, "treecko", true)) cardTotal++;
        if (isFamilyOwnedInView(st, raidFam, true)) cardTotal++;
      });
    } else if (col.type === "multi-location-single") {
      maxCards = col.locations.length;
      col.locations.forEach(function(loc) {
        var st = getItemState(col.id, loc.id);
        if (isFamilyOwnedInView(st, col.fam, false)) shinyTotal++;
        if (isFamilyOwnedInView(st, col.fam, true)) cardTotal++;
      });
    } else {
      maxCards = col.roster.length;
      col.roster.forEach(function(r) {
        var st = getItemState(col.id, r.id);
        if (isFamilyOwnedInView(st, r.fam, false)) shinyTotal++;
        if (isFamilyOwnedInView(st, r.fam, true)) cardTotal++;
      });
    }
    return { shinyTotal: shinyTotal, cardTotal: cardTotal, maxCards: maxCards, subA: subA, subB: subB };
  }

  function buildDotsHtml(st, famKey) {
    var fam = FAMILIES[famKey];
    var dots = fam.stages.map(function(p) {
      var shOwned = isStageShinyOwned(st, p.key);
      var cardOwned = isStageCardOwned(st, p.key);
      var cls = !st.isNormal ? (shOwned ? "on-sh" : "") : (shOwned ? "on-sh" : (cardOwned ? "on" : ""));
      return "«span class='evo-dot " + cls + "' title='" + escapeHtml(p.name) + "'»«/span»";
    }).join("");
    return "«span class='evo-dots' aria-hidden='true'»" + dots + "«/span»";
  }

  // itemBgAttr / itemBgKey：用來讓卡片標上 data-col-bg 或 data-loc-bg，
  // 這樣即使背景圖是稍後才探測成功的，畫面也會自動補上，不用重新整理頁面。
  function buildPokeCardHtml(itemBgAttr, itemBgKey, itemId, stampText, bgUrl, famKey, isOwned, unlockedByShinyInNorm, isShiny, dotsHtml, showModeBtnInCard) {
    var fam = FAMILIES[famKey];
    var sparkleHtml = isShiny ? "«div class='sparkles' aria-hidden='true'»«span class='sp1'»✨«/span»«span class='sp2'»✨«/span»«span class='sp3'»✦«/span»«/div»" : "";
    var badgeText = isOwned ? (unlockedByShinyInNorm ? "✨ 色背已連動" : "✓ 已擁有") : "+ 點此打勾";
    var badgeExtraCls = unlockedByShinyInNorm ? "from-shiny" : "";
    var bgAttr = " " + itemBgAttr + "='" + escapeHtml(itemBgKey) + "'";
    var modeTagHtml = showModeBtnInCard
      ? "«button type='button' class='ver-tag-btn " + (isShiny ? "" : "norm") + "' data-action='toggle-mode' data-id='" + escapeHtml(itemId) + "' title='切換此卡色背/普背'»" + (isShiny ? "✨ 色背 🔄" : "普背 🔄") + "«/button»"
      : "«span class='ver-tag " + (isShiny ? "" : "norm") + "'»" + (isShiny ? "✨ 色背" : "普背") + "«/span»";

    return [
      "«div class='pogo-card " + (isOwned ? "owned " : "locked ") + (isShiny ? "is-shiny" : "") + "'»",
      "  «div class='bg-layer'" + bgAttr + " style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»«/div»",
      sparkleHtml,
      "  «div class='card-top'»",
           modeTagHtml,
      "    «button type='button' class='own-badge " + badgeExtraCls + "' aria-pressed='" + (isOwned ? "true" : "false") + "' data-action='quick-toggle' data-id='" + escapeHtml(itemId) + "' data-fam='" + escapeHtml(famKey) + "'»" + badgeText + "«/button»",
      "  «/div»",
      "  «div class='card-preview-trigger' role='button' tabindex='0' data-action='open-modal' data-id='" + escapeHtml(itemId) + "' data-fam='" + escapeHtml(famKey) + "'»",
      "    «div class='poke-layer'»",
             pogoImgHtml(fam.baseDex, isShiny, fam.baseName),
      "    «/div»",
      "    «div class='loc-stamp'»",
      "      «div class='poke-name'»" + (isShiny ? "✨ " : "") + escapeHtml(fam.baseName) + " " + dotsHtml + "«/div»",
      "      «div class='stamp-pill'»📍 " + escapeHtml(stampText) + "«/div»",
      "      «div class='evo-hint'»" + escapeHtml(fam.baseName) + " 🧬進化鏈«/div»",
      "    «/div»",
      "  «/div»",
      "«/div»"
    ].join("");
  }

  function render() {
    var appRoot = document.getElementById("appRoot");
    if (!currentColId) {
      renderHomeView(appRoot);
    } else {
      renderCollectionView(appRoot, getCol(currentColId));
    }
  }

  function renderHomeView(container) {
    var grandShiny = 0, grandCard = 0, grandMax = 0;
    var albumCardsHtml = COLLECTIONS.map(function(col) {
      var st = computeCollectionStats(col);
      grandShiny += st.shinyTotal;
      grandCard += st.cardTotal;
      grandMax += st.maxCards;
      var pct = st.maxCards ? Math.round(st.shinyTotal / st.maxCards * 100) : 0;
      var bgUrl = col.homeBanner || resolvedBgByCol[col.id] || "";
      var pokesHtml = col.homeBanner ? "" : (col.coverPokes || []).map(function(dex) {
        return pogoImgHtml(dex, true, "封面寶可夢", "album-poke");
      }).join("");

      var albumBgAttr = col.homeBanner ? "" : (" data-col-bg='" + escapeHtml(col.id) + "'");
      return [
        "«div class='album-card' role='button' tabindex='0' data-action='open-col' data-col='" + escapeHtml(col.id) + "'»",
        "  «div class='album-visual'" + albumBgAttr + " style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»",
        "    «span class='album-tag'»" + escapeHtml(col.tag) + "«/span»",
        "    «div class='album-pokes'»" + pokesHtml + "«/div»",
        "  «/div»",
        "  «div class='album-body'»",
        "    «div class='album-title'»" + escapeHtml(col.title) + "«/div»",
        "    «div class='album-sub'»" + escapeHtml(col.subtitle) + "«/div»",
        "    «div class='prog-wrap'»",
        "      «div class='prog-text'»",
        "        «span»✨ 色背 " + st.shinyTotal + " / " + st.maxCards + " (" + pct + "%)«/span»",
        "        «span»🎴 背卡 " + st.cardTotal + " / " + st.maxCards + "«/span»",
        "      «/div»",
        "      «div class='bar-bg'»«div class='bar-fill' style='width:" + pct + "%;'»«/div»«/div»",
        "    «/div»",
        "    «div class='album-enter'»點此進入卡冊 ➔«/div»",
        "  «/div»",
        "«/div»"
      ].join("");
    }).join("");

    var grandPct = grandMax ? Math.round(grandShiny / grandMax * 100) : 0;

    renderTemplate(container, [
      "«header»",
      "  «h1»✨ Pokémon GO 背卡圖鑑«/h1»",
      "  «div class='sub-header'»選擇下方活動卡冊進入打勾｜所有進度自動獨立保存在本機瀏覽器«/div»",
      "  «div class='prog-wrap'»",
      "    «div class='prog-text'»",
      "      «span»🏆 全站總色背進度：" + grandShiny + " / " + grandMax + " (" + grandPct + "%)«/span»",
      "      «span»🎴 全站背卡總收藏：" + grandCard + " / " + grandMax + "«/span»",
      "    «/div»",
      "    «div class='bar-bg'»«div class='bar-fill' style='width:" + grandPct + "%;'»«/div»«/div»",
      "  «/div»",
      "«/header»",
      "«main class='albums-grid'»" + albumCardsHtml + "«/main»"
    ].join(""));

    bindImgFallbacks(container);
  }

  function renderCollectionView(container, col) {
    var stats = computeCollectionStats(col);
    var pct = stats.maxCards ? Math.round(stats.shinyTotal / stats.maxCards * 100) : 0;
    var rightStatText = col.type === "multi-location"
      ? ("🌿 色背木守宮 " + stats.subA + "/27 ｜ ⚔️ 色背團體戰 " + stats.subB + "/27")
      : col.type === "multi-location-single"
      ? ("⚡ 色背進度 " + stats.shinyTotal + "/" + stats.maxCards)
      : ("📍 地標印章：" + col.locStamp);

    var filterBtnsHtml = col.filters.map(function(f) {
      var act = (filter === f.key) ? " active" : "";
      return "«button type='button' class='btn" + act + "' data-action='set-filter' data-z='" + escapeHtml(f.key) + "'»" + escapeHtml(f.label) + "«/button»";
    }).join("");

    var cardsAreaHtml = "";
    if (col.type === "multi-location") {
      var boxes = [];
      col.locations.forEach(function(loc) {
        var st = getItemState(col.id, loc.id);
        var raidFamKey = col.zoneToFamily[loc.zone];
        var tShiny = isFamilyOwnedInView(st, "treecko", false);
        var rShiny = isFamilyOwnedInView(st, raidFamKey, false);
        if (filter === "MISS" && (tShiny && rShiny)) return;
        if (["ALL", "MISS"].indexOf(filter) === -1 && loc.zone !== filter) return;
        var searchable = (loc.id + " " + loc.eng + " " + loc.zh + " " + loc.county).toLowerCase();
        if (query && searchable.indexOf(query) === -1) return;

        var isShiny = !st.isNormal;
        var tOwnedView = isFamilyOwnedInView(st, "treecko", st.isNormal);
        var rOwnedView = isFamilyOwnedInView(st, raidFamKey, st.isNormal);
        var locKey = col.id + "|" + loc.id;
        var bgUrl = resolvedBgByLoc[locKey] || "";
        var stamp = loc.eng + " • " + loc.county;

        var cardT = buildPokeCardHtml("data-loc-bg", locKey, loc.id, stamp, bgUrl, "treecko", tOwnedView, (st.isNormal && tShiny), isShiny, buildDotsHtml(st, "treecko"), false);
        var cardR = buildPokeCardHtml("data-loc-bg", locKey, loc.id, stamp, bgUrl, raidFamKey, rOwnedView, (st.isNormal && rShiny), isShiny, buildDotsHtml(st, raidFamKey), false);

        boxes.push([
          "«div class='set-box'»",
          "  «div class='set-header'»",
          "    «div class='set-title-wrap'»",
          "      «div class='set-eng'»«span class='set-id'»" + escapeHtml(loc.id) + "«/span» " + escapeHtml(loc.eng) + "«/div»",
          "      «div class='set-zh'»" + escapeHtml(loc.zh) + " (" + escapeHtml(loc.county) + ")«/div»",
          "    «/div»",
          "    «button type='button' class='mode-btn " + (isShiny ? "" : "normal-mode") + "' data-action='toggle-mode' data-id='" + escapeHtml(loc.id) + "'»",
                 (isShiny ? "🔄 切換普背" : "✨ 切換色背"),
          "    «/button»",
          "  «/div»",
          "  «div class='pair-grid'»" + cardT + cardR + "«/div»",
          "«/div»"
        ].join(""));
      });
      cardsAreaHtml = "«main class='sets-grid' id='grid'»" + boxes.join("") + "«/main»";
    } else if (col.type === "multi-location-single") {
      // 每個地點只有一張卡（單一共用家族，例如皮卡丘進化鏈），不像 multi-location 那樣配成對
      var singleLocCards = [];
      col.locations.forEach(function(loc) {
        var st = getItemState(col.id, loc.id);
        var shOwned = isFamilyOwnedInView(st, col.fam, false);
        if (filter === "MISS" && shOwned) return;
        var searchable = (loc.id + " " + loc.eng + " " + loc.zh).toLowerCase();
        if (query && searchable.indexOf(query) === -1) return;

        var isShiny = !st.isNormal;
        var ownedView = isFamilyOwnedInView(st, col.fam, st.isNormal);
        var locKey = col.id + "|" + loc.id;
        var bgUrl = resolvedBgByLoc[locKey] || "";
        var stamp = loc.eng + (loc.zh && loc.zh !== loc.eng ? " • " + loc.zh : "");

        singleLocCards.push(
          buildPokeCardHtml("data-loc-bg", locKey, loc.id, stamp, bgUrl, col.fam, ownedView, (st.isNormal && shOwned), isShiny, buildDotsHtml(st, col.fam), true)
        );
      });
      cardsAreaHtml = "«main class='single-poke-grid' id='grid'»" + singleLocCards.join("") + "«/main»";
    } else {
      var singleCards = [];
      var bgUrl = resolvedBgByCol[col.id] || "";
      col.roster.forEach(function(r) {
        var st = getItemState(col.id, r.id);
        var fam = FAMILIES[r.fam];
        var shOwned = isFamilyOwnedInView(st, r.fam, false);
        if (filter === "MISS" && shOwned) return;
        if (["ALL", "MISS"].indexOf(filter) === -1 && r.zone !== filter) return;
        var searchable = (r.id + " " + fam.baseName + " " + r.fam + " " + (r.note || "")).toLowerCase();
        if (query && searchable.indexOf(query) === -1) return;

        var isShiny = !st.isNormal;
        var ownedView = isFamilyOwnedInView(st, r.fam, st.isNormal);
        singleCards.push(
          buildPokeCardHtml("data-col-bg", col.id, r.id, col.locStamp + (r.note ? "｜" + r.note : ""), bgUrl, r.fam, ownedView, (st.isNormal && shOwned), isShiny, buildDotsHtml(st, r.fam), true)
        );
      });
      cardsAreaHtml = "«main class='single-poke-grid' id='grid'»" + singleCards.join("") + "«/main»";
    }

    renderTemplate(container, [
      "«header»",
      "  «div class='nav-bar'»",
      "    «button type='button' class='back-home-btn' data-action='go-home'»⬅️ 返回首頁大廳«/button»",
      "    «span class='col-badge'»" + escapeHtml(col.tag) + "«/span»",
      "  «/div»",
      "  «h1»" + escapeHtml(col.title) + "«/h1»",
      "  «div class='sub-header'»" + escapeHtml(col.subtitle) + "«/div»",
      "  «div class='prog-wrap'»",
      "    «div class='prog-text'»",
      "      «span id='st-loc'»✨ 色背進度：" + stats.shinyTotal + " / " + stats.maxCards + " (" + pct + "%) ｜ 🎴 背卡收藏：" + stats.cardTotal + " / " + stats.maxCards + "«/span»",
      "      «span id='st-det'»" + escapeHtml(rightStatText) + "«/span»",
      "    «/div»",
      "    «div class='bar-bg'»«div class='bar-fill' style='width:" + pct + "%;'»«/div»«/div»",
      "  «/div»",
      "«/header»",
      "«div class='toolbar'»",
      "  «input type='search' id='q' class='search' value='" + escapeHtml(query) + "' placeholder='🔍 搜尋'»",
         filterBtnsHtml,
      "  «button type='button' class='btn btn-global-mode' data-action='global-mode'»" + (allNormalToggle ? "✨ 色背" : "🔄普背") + "«/button»",
      "«/div»",
      cardsAreaHtml
    ].join(""));

    var qInput = document.getElementById("q");
    if (qInput) {
      qInput.addEventListener("input", function(e) {
        query = e.target.value.trim().toLowerCase();
        render();
        var newQ = document.getElementById("q");
        if (newQ) { newQ.focus(); newQ.setSelectionRange(newQ.value.length, newQ.value.length); }
      });
    }

    bindImgFallbacks(container);
  }

  function renderModalContent(itemId, famKey) {
    var col = getCol(currentColId);
    if (!col) return;
    var st = getItemState(col.id, itemId);
    var isShiny = !st.isNormal;
    var fam = FAMILIES[famKey];
    var allOwned = isFamilyAllOwnedInView(st, famKey, st.isNormal);

    var titlePrefix = "";
    var bgUrl = "";
    var stampText = "";

    if (MULTI_LOCATION_TYPES.indexOf(col.type) !== -1) {
      var loc = col.locations.find(function(x) { return x.id === itemId; });
      if (!loc) return;
      titlePrefix = loc.zh && loc.zh !== loc.eng ? (loc.eng + " (" + loc.zh + ")") : loc.eng;
      bgUrl = resolvedBgByLoc[col.id + "|" + loc.id] || "";
      stampText = loc.eng;
    } else {
      titlePrefix = col.title;
      bgUrl = resolvedBgByCol[col.id] || "";
      stampText = col.locStamp;
    }

    var stageCardsHtml = fam.stages.map(function(p) {
      var shOwned = isStageShinyOwned(st, p.key);
      var owned = isStageOwnedInView(st, p.key, st.isNormal);
      var linkedFromShiny = st.isNormal && shOwned;
      var badgeText = owned ? (linkedFromShiny ? "✨ 色背已連動" : "✓ 已擁有") : "點擊打勾";
      var sparkleHtml = isShiny ? "«div class='sparkles' aria-hidden='true'»«span class='sp1'»✨«/span»«span class='sp2'»✨«/span»«/div»" : "";
      return [
        "«div class='pogo-card " + (owned ? "owned " : "locked ") + (isShiny ? "is-shiny" : "") + "' role='button' tabindex='0' aria-pressed='" + (owned ? "true" : "false") + "' data-action='toggle-stage' data-id='" + escapeHtml(itemId) + "' data-stage='" + escapeHtml(p.key) + "'»",
        "  «div class='bg-layer' style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»«/div»",
        sparkleHtml,
        "  «div class='card-top'»",
        "    «span class='ver-tag " + (isShiny ? "" : "norm") + "'»" + escapeHtml(p.stage) + "«/span»",
        "    «span class='own-badge " + (linkedFromShiny ? "from-shiny" : "") + "'»" + badgeText + "«/span»",
        "  «/div»",
        "  «div class='poke-layer'»",
             pogoImgHtml(p.dex, isShiny, p.name),
        "  «/div»",
        "  «div class='loc-stamp'»",
        "    «div class='poke-name'»" + (isShiny ? "✨ " : "") + escapeHtml(p.name) + "«/div»",
        "    «div class='stamp-pill'»📍 " + escapeHtml(stampText) + "«/div»",
        "  «/div»",
        "«/div»"
      ].join("");
    }).join("");

    var modalBox = document.getElementById("evoModalContent");
    renderTemplate(modalBox, [
      "«div class='modal-head'»",
      "  «div class='modal-title' id='modalTitleText'»",
      "    «span class='set-id'»" + escapeHtml(itemId) + "«/span» " + escapeHtml(titlePrefix) + " — " + escapeHtml(fam.baseName) + "進化鏈",
      "  «/div»",
      "  «div style='display:flex;gap:8px;'»",
      "    «button type='button' class='mode-btn " + (isShiny ? "" : "normal-mode") + "' data-action='toggle-mode' data-id='" + escapeHtml(itemId) + "'»",
             (isShiny ? "🔄 普背" : "✨ 色背"),
      "    «/button»",
      "    «button type='button' class='close-btn' data-action='close-modal'»✕ 關閉«/button»",
      "  «/div»",
      "«/div»",
      "«div class='evo-subbar'»",
      "  «span»" + escapeHtml(fam.label) + "（勾選色背自動連動普背；勾選普背不影響色背）«/span»",
      "  «button type='button' class='check-all-btn' data-action='toggle-all-stages' data-id='" + escapeHtml(itemId) + "' data-fam='" + escapeHtml(famKey) + "'»",
           (allOwned ? "取消全選此進化鏈" : "✓ 一鍵全勾此進化鏈"),
      "  «/button»",
      "«/div»",
      "«div class='evo-row'»" + stageCardsHtml + "«/div»"
    ].join(""));
    bindImgFallbacks(modalBox);
  }

  function quickToggleFamily(itemId, famKey) {
    var st = getItemState(currentColId, itemId);
    var fam = FAMILIES[famKey];
    if (!st.isNormal) {
      var anyShiny = isFamilyOwnedInView(st, famKey, false);
      if (anyShiny) {
        fam.stages.forEach(function(p) { st[p.key] = false; });
      } else {
        st[fam.stages[0].key] = true;
      }
    } else {
      if (isFamilyOwnedInView(st, famKey, false)) {
        warnLockedByShiny();
        return;
      }
      var anyNorm = isFamilyOwnedInView(st, famKey, true);
      if (anyNorm) {
        fam.stages.forEach(function(p) { st["n_" + p.key] = false; });
      } else {
        st["n_" + fam.stages[0].key] = true;
      }
    }
    saveColState(currentColId);
    render();
  }

  function toggleStageOwn(itemId, baseKey) {
    var st = getItemState(currentColId, itemId);
    if (!st.isNormal) {
      st[baseKey] = !st[baseKey];
    } else {
      if (st[baseKey]) {
        warnLockedByShiny();
        return;
      }
      var nk = "n_" + baseKey;
      st[nk] = !st[nk];
    }
    saveColState(currentColId);
    render();
    if (activeModalItemId === itemId && activeModalFamily) renderModalContent(itemId, activeModalFamily);
  }

  function toggleAllStagesInModal(itemId, famKey) {
    var st = getItemState(currentColId, itemId);
    var fam = FAMILIES[famKey];
    var all = isFamilyAllOwnedInView(st, famKey, st.isNormal);
    if (!st.isNormal) {
      fam.stages.forEach(function(p) { st[p.key] = !all; });
    } else {
      if (all && isFamilyOwnedInView(st, famKey, false)) warnLockedByShiny();
      fam.stages.forEach(function(p) { st["n_" + p.key] = !all; });
    }
    saveColState(currentColId);
    render();
    if (activeModalItemId === itemId && activeModalFamily === famKey) renderModalContent(itemId, famKey);
  }

  function toggleSetMode(itemId) {
    var st = getItemState(currentColId, itemId);
    st.isNormal = !st.isNormal;
    saveColState(currentColId);
    render();
    if (activeModalItemId === itemId && activeModalFamily) renderModalContent(itemId, activeModalFamily);
  }

  function openEvoModal(itemId, famKey) {
    activeModalItemId = itemId;
    activeModalFamily = famKey;
    renderModalContent(itemId, famKey);
    document.getElementById("evoModal").classList.add("show");
  }

  function closeEvoModal() {
    activeModalItemId = null;
    activeModalFamily = null;
    document.getElementById("evoModal").classList.remove("show");
  }

  function handleActionTrigger(target, ev) {
    var actionEl = target.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.getAttribute("data-action");
    var id = actionEl.getAttribute("data-id");
    var fam = actionEl.getAttribute("data-fam");
    var stage = actionEl.getAttribute("data-stage");

    if (action === "open-col") {
      currentColId = actionEl.getAttribute("data-col");
      filter = "ALL";
      query = "";
      allNormalToggle = false;
      window.scrollTo(0, 0);
      render();
    } else if (action === "go-home") {
      currentColId = null;
      query = "";
      window.scrollTo(0, 0);
      render();
    } else if (action === "set-filter") {
      filter = actionEl.getAttribute("data-z");
      render();
    } else if (action === "global-mode") {
      allNormalToggle = !allNormalToggle;
      var col = getCol(currentColId);
      var list = col.type === "multi-location" || col.type === "multi-location-single" ? col.locations : col.roster;
      list.forEach(function(entry) {
        getItemState(currentColId, entry.id).isNormal = allNormalToggle;
      });
      saveColState(currentColId);
      render();
    } else if (action === "quick-toggle") {
      ev.stopPropagation();
      quickToggleFamily(id, fam);
    } else if (action === "open-modal") {
      openEvoModal(id, fam);
    } else if (action === "toggle-mode") {
      ev.stopPropagation();
      toggleSetMode(id);
    } else if (action === "toggle-stage") {
      toggleStageOwn(id, stage);
    } else if (action === "toggle-all-stages") {
      toggleAllStagesInModal(id, fam);
    } else if (action === "close-modal") {
      closeEvoModal();
    }
  }

  document.body.addEventListener("click", function(ev) {
    if (ev.target.id === "evoModal") {
      closeEvoModal();
      return;
    }
    handleActionTrigger(ev.target, ev);
  });

  document.body.addEventListener("keydown", function(ev) {
    if (ev.key === "Escape" && activeModalItemId) {
      closeEvoModal();
      return;
    }
    if (ev.key === "Enter" || ev.key === " ") {
      var actionEl = ev.target.closest("[data-action]");
      if (actionEl && actionEl.tagName !== "BUTTON") {
        ev.preventDefault();
        handleActionTrigger(actionEl, ev);
      }
    }
  });

  render();
})();
</script>
</body>
</html>
